<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개 카드</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 p-6">

  <div class="w-full max-w-sm bg-white rounded-2xl border border-gray-200 p-8 text-center">

    <!-- 아바타 -->
    <div class="w-16 h-16 mx-auto rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-sm font-medium">
      👤
    </div>

    <!-- 상태 뱃지 -->
    <div class="mt-3 flex items-center justify-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-green-500"></span>
      <span class="text-xs text-green-600">공부 중</span>
    </div>

    <!-- 이름 & 전공 -->
    <div class="mt-3">
      <h1 class="text-xl font-medium text-gray-900">이효빈</h1>
      <p class="mt-1 text-xs text-gray-400 tracking-wide">영어 · 컴퓨터공학 전공</p>
    </div>

    <!-- 소개 -->
    <p class="mt-3 text-sm text-gray-500 leading-relaxed">
      하고 싶은 걸 만들 수 있는 개발자를 꿈꾸고 있어요
    </p>

    <!-- 구분선 -->
    <hr class="mt-5 border-gray-100">

    <!-- 기술 태그 -->
    <div class="mt-5 flex flex-wrap justify-center gap-2">
      <span class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-sm">HTML</span>
      <span class="px-3 py-1 rounded-full bg-purple-100 text-purple-700 text-sm">CSS</span>
      <span class="px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 text-sm">JavaScript</span>
      <span class="px-3 py-1 rounded-full bg-cyan-100 text-cyan-700 text-sm">React</span>
    </div>

    <!-- 버튼 -->
    <div class="mt-5 grid grid-cols-2 gap-2">
      <a href="#" class="py-2 rounded-lg bg-gray-900 text-white text-sm font-medium hover:opacity-80 transition">
        GitHub
      </a>
      <a href="#" class="py-2 rounded-lg border border-gray-200 text-gray-700 text-sm font-medium hover:bg-gray-50 transition">
        Blog
      </a>
    </div>

  </div>

</body>
</html>
